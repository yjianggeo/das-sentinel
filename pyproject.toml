[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "das-sentinel"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.34",
  "pydantic>=2.10",
  "pydantic-settings>=2.7",
  "sqlalchemy>=2.0",
  "alembic>=1.14",
  "numpy>=2.0",
  "scipy>=1.14",
  "h5py>=3.12",
  "scikit-learn>=1.6",
  "skops>=0.14",
  "matplotlib>=3.9",
  "tzdata>=2025.2; platform_system == 'Windows'",
  "argon2-cffi>=23.1",
  "itsdangerous>=2.2",
  "httpx>=0.28",
  "typer>=0.15",
]

[project.optional-dependencies]
gpu = ["cupy-cuda12x>=14.0"]
dev = ["pytest>=8.3", "pytest-cov>=6", "ruff>=0.9", "mypy>=1.14", "PyYAML>=6.0"]

[project.scripts]
das-sentinel = "das_sentinel.cli:app"

[tool.setuptools.packages.find]
where = ["backend/src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["backend/src"]
addopts = "-m 'not performance'"
markers = ["performance: opt-in single-file CPU benchmark"]
