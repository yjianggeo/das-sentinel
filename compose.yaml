services:
  api:
    build:
      context: .
      dockerfile: docker/Dockerfile.cpu
    command: ["api"]
    env_file: [.env]
    ports: ["8000:8000"]
    volumes:
      - type: bind
        source: ${DAS_DATA_ROOT}
        target: /data
        read_only: true
      - type: volume
        source: app-data
        target: /app-data
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/healthz')"]
      interval: 15s
      timeout: 5s
      retries: 5

volumes:
  app-data: {}
