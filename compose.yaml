services:
  api:
    build:
      context: .
      dockerfile: docker/Dockerfile.cpu
    command: ["api"]
    env_file: [.env]
    restart: unless-stopped
    ports: ["127.0.0.1:${DAS_HTTP_PORT:-8000}:8000"]
    environment:
      DAS_DATA_ROOT: /data
    volumes:
      - type: bind
        source: ${DAS_HOST_DATA_ROOT}
        target: /data
        read_only: true
      - type: volume
        source: app-data
        target: /app-data
    healthcheck:
      test: ["CMD", "python", "-c", "import json, urllib.request; assert json.load(urllib.request.urlopen('http://127.0.0.1:8000/healthz'))['status'] == 'ok'"]
      interval: 15s
      timeout: 5s
      retries: 5

volumes:
  app-data: {}
